name: Continuous Integration

on:
  push:
    branches: master
    paths:
      - 'cmd/kahuna/**'
      - 'internal/kahuna/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'config/templates/**'
      - '.github/workflows/**'
  pull_request:
    branches: master
  workflow_dispatch:

jobs:
  ci:
    uses: kowabunga-cloud/workflows/.github/workflows/go-ci.yml@v1
    secrets: inherit
    with:
      mongodb: true

  # container image build and vulnerability scan (published on release)
  image:
    uses: kowabunga-cloud/workflows/.github/workflows/container.yml@v1
    with:
      image: kahuna
