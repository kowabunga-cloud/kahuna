name: Trigger Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  # container image publishing, signing and attestations
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: kowabunga-cloud/workflows/.github/workflows/go-release.yml@v1
    secrets: inherit
    with:
      image: kahuna
      image-description: Kowabunga Kahuna orchestrator
